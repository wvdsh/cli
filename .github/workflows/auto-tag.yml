name: Auto Tag on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Verify the pinned sdk-js matches the version play ships
        env:
          GH_TOKEN: ${{ secrets.PLAY_READ_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PLAY_READ_PAT is not set on this repo. It's a fine-grained PAT scoped to wvdsh/play with Contents: Read-only, used to read the sdk-js version play ships — see the Releases section of CLAUDE.md."
            exit 1
          fi

          pinned=$(tr -d '[:space:]' < src/dev/sdk-js-version)

          # play deploys prod on `release: published`, so its latest release is what
          # is live — not the tip of its main branch.
          tag=$(gh api repos/wvdsh/play/releases/latest --jq .tag_name)
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/wvdsh/play/contents/package-lock.json?ref=$tag" \
            > "$RUNNER_TEMP/play-lock.json"
          # package.json only carries a caret range, so read the resolved version.
          shipped=$(jq -r '.packages["node_modules/@wvdsh/sdk-js"].version' "$RUNNER_TEMP/play-lock.json")

          echo "cli pins $pinned; play $tag ships $shipped"

          if [ -z "$pinned" ]; then
            echo "::error::src/dev/sdk-js-version is empty"
            exit 1
          fi

          if [ -z "$shipped" ] || [ "$shipped" = "null" ]; then
            echo "::error::Could not read @wvdsh/sdk-js out of play $tag's package-lock.json"
            exit 1
          fi

          if [ "$pinned" != "$shipped" ]; then
            echo "::error::wavedash dev would inject @wvdsh/sdk-js@$pinned but play $tag ships $shipped. Run scripts/bump-sdk-js.sh $shipped, verify a game boots with wavedash dev, then push the bump to retry the release."
            exit 1
          fi

      - name: Get version
        id: get_version
        run: |
          # Extract version from Cargo.toml using grep to avoid needing full cargo setup/compilation
          # Assumes 'version = "x.y.z"' is at the top level [package]
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f2)
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and Push Version Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.get_version.outputs.version }}" -m "Release ${{ steps.get_version.outputs.version }}" || echo "Tag already exists"
          git push origin "${{ steps.get_version.outputs.version }}" || echo "Tag already pushed"

