[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# release.yml adds configuration and signature checks around dist's signing jobs.
# Keep those steps when updating the workflow; see docs/windows-signing.md.
allow-dirty = ["ci"]
# Custom build setup steps
github-build-setup = "../build-setup.yml"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "wvdsh/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Use tar.gz instead of tar.xz so self_update can extract them
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Self-update is handled in-binary via self_update crate
install-updater = false
# Custom build command to inject Doppler secrets at compile time
# build-command = ["doppler", "run", "--", "cargo", "build", "--profile=dist"]

# scripts/configure-windows-signing.py replaces these markers in signing jobs.
# Account identifiers belong in the GitHub `release` environment, not this file.
[dist.azure-windows-sign]
endpoint = "CONFIGURED_IN_CI"
account-name = "CONFIGURED_IN_CI"
certificate-profile-name = "CONFIGURED_IN_CI"
